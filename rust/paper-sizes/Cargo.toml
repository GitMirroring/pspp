[package]
name = "paper-sizes"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0 OR LGPL-2.1-or-later"
authors = [ "Ben Pfaff" ]
description = "Detects paper sizes and defaults"

[dependencies]
xdg = "3.0.0"
serde = { version = "1.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.176"

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
serde_json = "1.0.145"
